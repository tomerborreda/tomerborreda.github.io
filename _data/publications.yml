# Single source of truth for publications.
# Feeds both the website (index.html) and the CV (publications.tex, served at
# https://tomerborreda.github.io/publications.tex and linked into Overleaf).
#
# Order here = order on the site and in the CV (newest first).
# Fields:
#   title, venue, year      required
#   authors                 list of {name, url}; url optional. "Tomer Borreda" is bolded automatically.
#   links                   list of {label, url}; first link is also used for the title on the website
#   image                   thumbnail (needed to show on the website)
#   hover                   optional image/gif shown on mouse-over
#   website / cv            set to false to hide from that output (default: shown)

